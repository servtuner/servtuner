name: Setup toolchains
description: >-
  Read .tool-versions (the only place toolchain versions are defined), install just and uv, and on request Go,
  Node.js and the release tools (helm, helmfile, hauler), so each CI job installs only what it uses.
inputs:
  go:
    description: Install Go
    default: "false"
  node:
    description: Install Node.js
    default: "false"
  release-tools:
    description: Install helm, helmfile and hauler, checksum-verified (.github/scripts/install-release-tools.sh)
    default: "false"
outputs:
  go:
    description: Go version
    value: ${{ steps.pins.outputs.go }}
  nodejs:
    description: Node.js version
    value: ${{ steps.pins.outputs.nodejs }}
runs:
  using: composite
  steps:
    - name: Read toolchain pins
      id: pins
      shell: bash
      run: |
        while read -r tool version; do
          case "$tool" in ''|\#*) continue ;; esac
          echo "${tool}=${version}" >> "$GITHUB_OUTPUT"
        done < .tool-versions
    - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
      with:
        just-version: ${{ steps.pins.outputs.just }} # zizmor: ignore[unpinned-tools] pinned in .tool-versions
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      with:
        version: ${{ steps.pins.outputs.uv }} # zizmor: ignore[unpinned-tools] pinned in .tool-versions
        python-version: ${{ steps.pins.outputs.python }}
    - if: inputs.go == 'true'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ steps.pins.outputs.go }}
        cache: false
    - if: inputs.node == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ steps.pins.outputs.nodejs }}
    - if: inputs.release-tools == 'true'
      shell: bash
      run: .github/scripts/install-release-tools.sh "$RUNNER_TEMP/bin"
