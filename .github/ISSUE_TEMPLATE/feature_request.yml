name: Feature request
description: Suggest a new capability or a change to an existing one.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A clear problem statement helps more than a finished design:
        it lets us look for the smallest change that solves it.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today.
      placeholder: When I compare two vLLM configurations, I cannot ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like servtuner to behave. Include example RunSpec fields, commands or UI changes if you have them.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried, and why they fall short.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI
        - loadgen engine
        - inference-perf engine
        - Analysis, capacity or recommendations
        - Workloads and presets
        - API
        - Web UI
        - Helm chart or install
        - Managed vLLM, tuning sessions or the launcher
        - New target type
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, benchmark results or screenshots that help explain the request. Remove private hostnames and data.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I would be willing to open a pull request for this.
