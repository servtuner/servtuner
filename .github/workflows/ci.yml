name: ci

on:
  # Branches are checked through their pull request; main is checked again after each merge.
  push:
    branches: [main]
  pull_request:
  # The release workflow runs every gate again on the commit it publishes.
  workflow_call:
  # Check a branch that has no pull request.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Everything else gets a group of its own (the run id), so a push
# to main or a release's gates are never cancelled or held back by another run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs run in parallel; each installs only the toolchains it uses (.github/actions/setup). Locally, `just gen-check`,
# `just lint` and `just test` run the same checks in one go.
jobs:
  # Regenerating changes nothing, and every image a release renders is in deploy/release/images.lock (helm, helmfile).
  generated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git
      - uses: ./.github/actions/setup
        with: { go: "true", node: "true", release-tools: "true" }
      - run: just setup
      - run: just gen-check

  # The checks that belong to no component: schema JSON, duplication across the repo, file sizes, the workflows.
  lint-repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git
      - uses: ./.github/actions/setup
        with: { node: "true" }
      - run: just --justfile schema/Justfile --working-directory schema lint
      - run: just jscpd large-files lint-workflows
        env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits (just lint-workflows)

  # One component's own lint and tests. The api tests build the real bench, so they need Go (without it they skip);
  # deploy's chart tests need helm.
  component:
    name: component (${{ matrix.component }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: bench, go: "true" }
          - { component: api, go: "true" }
          - { component: frontend, node: "true" }
          - { component: deploy, go: "true", release-tools: "true" }
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git
      - uses: ./.github/actions/setup
        with:
          go: ${{ matrix.go || 'false' }}
          node: ${{ matrix.node || 'false' }}
          release-tools: ${{ matrix.release-tools || 'false' }}
      - run: just --justfile "$COMPONENT/Justfile" --working-directory "$COMPONENT" setup
      - run: just --justfile "$COMPONENT/Justfile" --working-directory "$COMPONENT" lint
      - run: just --justfile "$COMPONENT/Justfile" --working-directory "$COMPONENT" test

  # Local end to end, no cluster: a Postgres container, the api and the real bench binary.
  e2e-local:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [mutual-tls, tls-off]
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git
      - uses: ./.github/actions/setup
        with: { go: "true" }
      - run: just "e2e-local-$MODE"

  # The images build and work offline: schemas load, bench runs in both. docker and buildx are on the runner image.
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git
      - uses: ./.github/actions/setup
      - run: just images
      - run: just image-test

  # The chart on a fresh kind cluster: one job with TLS and client certificates, one without TLS. Each job has its own
  # runner, so `just kind-up` always starts from no cluster. kind, kubectl, helm and docker are
  # preinstalled on the runner image.
  e2e-kind:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [mutual-tls, tls-off]
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git

      - uses: ./.github/actions/setup

      - run: uv sync --locked --project api
      - run: just kind-up
      - run: just "e2e-$MODE"

  # The one check to require in branch protection: it passes only when every job above passed.
  ci-ok:
    if: always()
    needs: [generated, lint-repo, component, e2e-local, images, e2e-kind]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
