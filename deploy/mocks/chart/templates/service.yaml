apiVersion: v1
kind: Service
metadata:
  name: {{ include "openaiMock.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "openaiMock.labels" . | nindent 4 }}
spec:
  selector: {{- include "openaiMock.selectorLabels" . | nindent 4 }}
  ports:
    - {name: openai, port: {{ .Values.service.port }}, targetPort: openai}
    - {name: metrics, port: {{ .Values.service.metricsPort }}, targetPort: metrics}
