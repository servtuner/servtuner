# The kind environment's values for the servtuner chart: plain connections, a ReadWriteOnce volume, and the
# Envoy Gateway class kind uses (deploy/kind/envoy-gateway-class.yaml, applied after Envoy Gateway).
tls:
  enabled: false
storage:
  file:
    pvc: {create: true, accessMode: ReadWriteOnce, size: 1Gi}
postgres:
  auth: password           # without TLS, the api signs in with the generated password
  cnpg:
    storage: {size: 1Gi}
