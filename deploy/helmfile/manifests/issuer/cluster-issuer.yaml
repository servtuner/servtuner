# servtuner's private CA: the helmfile's servtuner-issuer release (install.issuer), and kind-up.sh on the dev
# cluster. Requires cert-manager. servtuner's certificates (tls.certManager.issuerRef) come from servtuner-ca.
# A bare self-signed issuer does not put ca.crt in issued Secrets, so the standard pattern is used:
# self-signed issuer -> CA certificate -> CA issuer, and servtuner's tls.certManager.issuerRef points at the CA issuer.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: servtuner-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: servtuner-ca
  namespace: cert-manager      # a ClusterIssuer reads its CA Secret from the cert-manager namespace
spec:
  isCA: true
  commonName: servtuner-ca
  secretName: servtuner-ca
  duration: 87600h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: servtuner-selfsigned, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: servtuner-ca
spec:
  ca:
    secretName: servtuner-ca
