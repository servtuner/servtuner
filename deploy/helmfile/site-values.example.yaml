# The site's values for the servtuner chart: copy to deploy/site-values.yaml and edit. It comes after the
# environment's values, so anything here wins. Every value of deploy/helm/servtuner/values.yaml may be set.
#
# The helmfile installs servtuner's private CA (the servtuner-ca ClusterIssuer) and a Gateway, and points the
# chart at both. Using your own instead: --state-values-set install.issuer=false,install.gateway=false and set
# tls.certManager.issuerRef and gateway.parentRefs (or ingress) here.
tls:
  enabled: true                  # TLS on every connection (false: plain HTTP, and postgres.auth password)
  clientAuth: required           # the api listener: required, optional or none
gateway:
  hostname: servtuner.example.internal
storage:
  file:
    pvc: {create: true, accessMode: ReadWriteMany, size: 100Gi}
