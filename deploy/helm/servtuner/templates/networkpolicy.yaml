{{- /* Only the ingress controller and bench Jobs reach the api's port, and
       nothing reaches a bench pod. Forward-header trust rests on this. Egress is left open:
       bench reaches targets anywhere, and the api reaches Postgres, storage and Kubernetes. */ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $runsNamespace := include "servtuner.runsNamespace" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "servtuner.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "servtuner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "servtuner.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: {{ .Values.api.port }}, protocol: TCP}
      from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressController.podSelector | nindent 12 }}
        {{- if .Values.gateway.enabled }}
        {{- /* The gateway's proxy pods. */}}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.gateway.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.gateway.podSelector | nindent 12 }}
        {{- end }}
        {{- if eq .Values.runner "kubernetes" }}
        {{- /* The labels the Kubernetes runner gives bench pods (COMPONENT_LABELS, kubernetes_runner/config.py). */}}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $runsNamespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: servtuner, app.kubernetes.io/component: bench}
        {{- end }}
        {{- with .Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if eq .Values.runner "kubernetes" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "servtuner.fullname" . }}-bench
  namespace: {{ $runsNamespace }}
  labels:
    {{- include "servtuner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: servtuner, app.kubernetes.io/component: bench}
  policyTypes: [Ingress]
  ingress: []
{{- end }}
{{- end }}
