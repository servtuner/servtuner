{{- /* Separate identities so IAM (Pod Identity) can scope api and bench differently. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.api.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "servtuner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccounts.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.bench.name }}
  namespace: {{ (include "servtuner.runsNamespace" .) }}
  labels:
    {{- include "servtuner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccounts.bench.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
