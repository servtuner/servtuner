{{- $fullname := include "servtuner.fullname" . }}
{{- $apiTls := include "servtuner.connectionTls" (dict "root" . "connection" "ingressApi") }}
{{- $checksClientCerts := and $apiTls (ne .Values.tls.clientAuth "none") }}
{{- $needsApiCert := include "servtuner.roleNeeded" (dict "root" . "role" "api") }}
{{- $postgresPassword := eq .Values.postgres.auth "password" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "servtuner.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "servtuner.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - {name: api, port: {{ .Values.api.port }}, targetPort: api}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "servtuner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "servtuner.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "servtuner.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.api.name }}
      {{- include "servtuner.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        fsGroup: {{ .Values.api.fsGroup }}
        seccompProfile: {type: RuntimeDefault}
      {{- if include "servtuner.anyTls" . }}
      initContainers:
        - {{- include "servtuner.caBundleInitContainer" . | nindent 10 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "servtuner.image" (dict "root" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - {name: api, containerPort: {{ .Values.api.port }}}
          envFrom:
            - configMapRef: {name: {{ $fullname }}-api}
          env:
            {{- /* bench records where it ran (environment.json); with the subprocess runner it inherits
                   these from the api, and analysis finds the bench pod's own CPU series by POD_NAME. */}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            {{- if include "servtuner.anyTls" . }}
            {{- include "servtuner.caBundleEnv" . | nindent 12 }}
            {{- end }}
            {{- if eq .Values.storage.backend "s3" }}
            {{- if eq .Values.storage.s3.credentials.source "secret" }}
            {{- with .Values.storage.s3.credentials.secretRef }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: {{ .name }}, key: {{ .accessKeyKey }}}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ .name }}, key: {{ .secretKeyKey }}}}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* postgres.auth password: the database user signs in with a password. */}}
            {{- if $postgresPassword }}
            - name: SERVTUNER_DATABASE_PASSWORD
              {{- if eq .Values.postgres.mode "cnpg" }}
              valueFrom: {secretKeyRef: {name: {{ include "servtuner.postgresName" . }}-app, key: password}}
              {{- else }}
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.external.passwordSecretRef.name | quote }}, key: {{ .Values.postgres.external.passwordSecretRef.key }}}}
              {{- end }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /* The kubelet's HTTP probe speaks neither TLS nor client certificates, so with TLS probe the port. */}}
          {{- if $apiTls }}
          readinessProbe:
            tcpSocket: {port: api}
          livenessProbe:
            tcpSocket: {port: api}
          {{- else }}
          readinessProbe:
            httpGet: {path: /healthz, port: api}
          livenessProbe:
            httpGet: {path: /healthz, port: api}
          {{- end }}
          {{- /* Keep serving while ingress-nginx drops this pod from its endpoints: without the pause,
          a rolling update's terminating pod refuses requests the ingress still sends it (502s). */}}
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: run-secrets, mountPath: /run/servtuner-secrets}
            {{- if eq .Values.storage.backend "file" }}
            - {name: data, mountPath: {{ .Values.storage.file.dataDir | quote }}}
            {{- end }}
            {{- if $needsApiCert }}
            - {name: tls-api, mountPath: /etc/servtuner/tls/api, readOnly: true}
            {{- end }}
            {{- if include "servtuner.anyTls" . }}
            {{- include "servtuner.caBundleVolumeMounts" . | nindent 12 }}
            {{- end }}
            {{- if $checksClientCerts }}
            - {name: ca-source, mountPath: /etc/servtuner/tls/client-ca, readOnly: true}
            {{- end }}
            {{- if eq .Values.auth.mode "local" }}
            - {name: setup-token, mountPath: /etc/servtuner/auth/setup-token, readOnly: true}
            {{- end }}
            {{- if eq .Values.runner "subprocess" }}
            {{- range .Values.subprocess.secrets }}
            - {name: run-secret-{{ . }}, mountPath: /etc/servtuner/secrets/{{ . }}, readOnly: true}
            {{- end }}
            {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- /* Keys of subprocess runs and target checks: in memory, never on the node's disk. */}}
        - name: run-secrets
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        {{- if eq .Values.storage.backend "file" }}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "servtuner.dataClaimName" . }}}
        {{- end }}
        {{- if $needsApiCert }}
        {{- include "servtuner.keySecretVolume" (dict "name" "tls-api" "secretName" (include "servtuner.tlsSecretName" (dict "root" . "role" "api"))) | nindent 8 }}
        {{- end }}
        {{- if include "servtuner.anyTls" . }}
        {{- include "servtuner.caBundleVolumes" . | nindent 8 }}
        {{- end }}
        {{- if eq .Values.auth.mode "local" }}
        {{- /* The setup token, read as a file and never stored. A missing Secret
               would hold the pod in ContainerCreating, so it is optional: the api then refuses setup. */}}
        - name: setup-token
          secret: {secretName: {{ include "servtuner.setupTokenSecretName" . | quote }}, defaultMode: 288, optional: true}
        {{- end }}
        {{- if eq .Values.runner "subprocess" }}
        {{- range .Values.subprocess.secrets }}
        {{- /* 0440 (decimal 288): owner and the pod's fsGroup read, as the Kubernetes runner mounts them. */}}
        - name: run-secret-{{ . }}
          secret: {secretName: {{ . | quote }}, defaultMode: 288}
        {{- end }}
        {{- end }}
