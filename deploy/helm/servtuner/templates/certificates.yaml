{{- /* Transport security with tls.source: cert-manager. With source: secret nothing is rendered here; pods mount the
       named Secrets the same way. Only roles that some hop needs get a Certificate. */ -}}
{{- if eq .Values.tls.source "cert-manager" }}
{{- $ns := .Release.Namespace }}
{{- $fullname := include "servtuner.fullname" . }}
{{- $databaseUser := ternary .Values.postgres.cnpg.owner .Values.postgres.external.user (eq .Values.postgres.mode "cnpg") }}
{{- /* localhost: api settings give the SubprocessRunner's bench https://localhost:<port> (servtuner_api/settings.py, api_url). */}}
{{- $apiDns := list (printf "%s-api" $fullname) (printf "%s-api.%s" $fullname $ns) (printf "%s-api.%s.svc" $fullname $ns) "localhost" }}
{{- $pgRw := printf "%s-rw" (include "servtuner.postgresName" .) }}
{{- $pgDns := list $pgRw (printf "%s.%s" $pgRw $ns) (printf "%s.%s.svc" $pgRw $ns) (printf "%s-ro.%s.svc" (include "servtuner.postgresName" .) $ns) (printf "%s-r.%s.svc" (include "servtuner.postgresName" .) $ns) }}
{{- $serverAndClient := list "digital signature" "key encipherment" "server auth" "client auth" }}
{{- $client := list "digital signature" "key encipherment" "client auth" }}
{{- $server := list "digital signature" "key encipherment" "server auth" }}
{{- if include "servtuner.roleNeeded" (dict "root" . "role" "api") }}
---
{{ include "servtuner.certificate" (dict "root" . "role" "api" "namespace" $ns "commonName" $databaseUser "dnsNames" $apiDns "usages" $serverAndClient) }}
{{- end }}
{{- if include "servtuner.roleNeeded" (dict "root" . "role" "bench") }}
---
{{ include "servtuner.certificate" (dict "root" . "role" "bench" "namespace" (include "servtuner.runsNamespace" .) "commonName" "servtuner-bench" "usages" $client) }}
{{- end }}
{{- if include "servtuner.roleNeeded" (dict "root" . "role" "ingress") }}
---
{{ include "servtuner.certificate" (dict "root" . "role" "ingress" "namespace" $ns "commonName" "servtuner-ingress" "usages" $client) }}
{{- end }}
{{- if include "servtuner.roleNeeded" (dict "root" . "role" "postgres") }}
---
{{ include "servtuner.certificate" (dict "root" . "role" "postgres" "namespace" $ns "commonName" $pgRw "dnsNames" $pgDns "usages" $server) }}
---
{{ include "servtuner.certificate" (dict "root" . "role" "postgresReplication" "namespace" $ns "commonName" "streaming_replica" "usages" $client) }}
{{- end }}
{{- end }}
