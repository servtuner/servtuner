# tls.mode mtls, user-provided kubernetes.io/tls Secrets; existing RWX claim in a separate runs namespace.
namespaces:
  runs: servtuner-runs
tls:
  mode: mtls
  source: secret
  secrets:
    api: my-api-tls
    bench: my-bench-tls
    ingress: my-ingress-tls
    postgres: my-postgres-tls
    postgresReplication: my-postgres-replication-tls
  caSecretRef: {name: my-private-ca}
storage:
  file:
    pvc: {create: false, existingClaim: my-servtuner-data, accessMode: ReadWriteMany}
rbac:
  bench:
    targetNamespaces: [targets-a]
