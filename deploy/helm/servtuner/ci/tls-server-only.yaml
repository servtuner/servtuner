# TLS without client certificates: the api asks for none, and Postgres takes a password over TLS.
tls:
  enabled: true
  clientAuth: none
  source: cert-manager
  certManager:
    issuerRef: {kind: ClusterIssuer, name: servtuner-ca}
postgres:
  auth: password
storage:
  file:
    pvc: {create: true, accessMode: ReadWriteMany}
