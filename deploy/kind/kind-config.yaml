# Cluster config for `just kind-up` (CI). The label lets ingress-nginx's kind manifest schedule its
# controller on the node; the e2e reaches it with `kubectl port-forward`, so no host ports are mapped.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
