# Workload preset decode-long@1. The workload block is immutable: a change to it
# is a new version file. slos and rps_hint are suggestions and may be corrected in place.
name: decode-long
version: 1
description: Short prompts with long generations, about 256 tokens in and 1536 out. Stresses decode, the KV pool and max_num_seqs.
engines: [loadgen]
workload:
  api: chat
  dataset:
    type: synthetic
    input_tokens: {mean: 256, stddev: 64}
    output_tokens: {mean: 1536, stddev: 384}
slos:
  ttft_p95: 1s
  itl_p95: 40ms
# Hand-written starting points, not measured capacity.
rps_hint:
  # rtx-3070-8gb (Qwen2.5-0.5B, max-model-len 4096): about half the ceiling of ~4800 output tokens/s measured
  # on that card.
  - {gpu_class: rtx-3070-8gb, start_rps: 1.5}  # 1536 output tokens: a ceiling near 3 RPS
  - {gpu_class: a100-80gb, start_rps: 3}
  - {gpu_class: h100-80gb, start_rps: 6}
