# Workload preset chat-multiturn@1. The workload block is immutable: a change to it
# is a new version file. slos and rps_hint are suggestions and may be corrected in place.
name: chat-multiturn
version: 1
description: "Six-turn chat, 256 tokens in and 256 out per turn. A growing context that exercises the prefix cache. Built by loadgen."
engines: [loadgen]
workload:
  api: chat
  dataset:
    type: synthetic
    input_tokens: {mean: 256}
    output_tokens: {mean: 256}
  conversation: {turns: 6}
slos:
  ttft_p95: 800ms
  itl_p95: 50ms
# Hand-written starting points, not measured capacity.
rps_hint:
  # rtx-3070-8gb (Qwen2.5-0.5B, max-model-len 4096): about half the ceiling of ~4800 output tokens/s measured
  # on that card.
  - {gpu_class: rtx-3070-8gb, start_rps: 4}  # context grows to ~3000 tokens: prefill limits it before output
  - {gpu_class: a100-80gb, start_rps: 6}
  - {gpu_class: h100-80gb, start_rps: 12}
