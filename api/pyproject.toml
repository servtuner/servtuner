[project]
name = "servtuner-api"
version = "0.0.0"
description = "servtuner control plane"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "argon2-cffi-bindings==26.1.0",
    "boto3==1.43.111",
    "botocore==1.43.111",
    "fastapi==0.162.0",
    "jsonschema==4.26.0",
    "lightkube==1.0.1",
    "lightkube-models==1.37.0.8",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "s3transfer==0.19.2",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "datamodel-code-generator==0.87.0",
    "httpx2==2.13.1",
    "pyrefly==1.4.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "testcontainers==4.15.0",
]

[project.scripts]
servtuner-api = "servtuner_api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servtuner_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Black formats; ruff only lints.
[tool.black]
line-length = 100
target-version = ["py314"]
# Generated by `just gen`; the generator's output is not ours to reformat.
extend-exclude = "src/servtuner_api/models/generated"

[tool.ruff]
line-length = 100
target-version = "py314"
# Generated by `just gen`; the generator's output is not ours to reformat.
extend-exclude = ["src/servtuner_api/models/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
