# The search space of the fixture session: max_num_seqs and
# max_num_batched_tokens in the scheduler tier (with the advisors' bounds),
# async_scheduling and api_server_count in the fine-tuning tier.
objective: slo_rps_per_gpu
noise_floor: 0.05
base: {vllm.enable_prefix_caching: true, vllm.gpu_memory_utilization: 0.75}
knobs:
  - {name: vllm.max_num_seqs, tier: scheduler, min: 32, max: 512, default: 64}
  - {name: vllm.max_num_batched_tokens, tier: scheduler, min: 1024, max: 16384, default: 8192}
  - {name: vllm.async_scheduling, tier: fine_tuning, values: [false, true], default: false}
  - {name: vllm.api_server_count, tier: fine_tuning, values: [1, 2], default: 1}
