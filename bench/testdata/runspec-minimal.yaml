# The minimal-vllm-client-cert example, written as YAML (comments and anchors are
# YAML-only, so this exercises the YAML to JSON conversion).
apiVersion: servtuner.dev/v2
kind: RunSpec
name: vllm-smoke-yaml
target:
  type: vllm
  endpoint: https://vllm.inference.svc:8000/v1
  model: example/model-8b
  tls:
    enabled: true
    clientCert:
      secretRef:
        name: servtuner-client
engine:
  type: loadgen
workload:
  streaming: true
  dataset:
    type: synthetic
    input_tokens: {mean: 128}
    output_tokens: {mean: 64}
load:
  stages:
    - rate: 1
      duration: 90s
